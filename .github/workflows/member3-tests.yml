name: Member 3 Tests

on:
  push:
    paths:
      - "member3/**"
      - ".github/workflows/member3-tests.yml"
  pull_request:
    paths:
      - "member3/**"
      - ".github/workflows/member3-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          if [ -f member3/requirements.txt ]; then
            pip install -r member3/requirements.txt
          fi

      - name: Run Member 3 tests
        run: PYTHONPATH=member3 python -m pytest member3/tests -q
